[project]
name = "travel-scraper"
version = "0.1.0"
description = "Travel place collection for the AI100 travel planner: OSM, Wikidata, discovery, crawling."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "scrapy>=2.12",
    "ddgs>=9.0",
]

[project.optional-dependencies]
# JavaScript rendering for pages that need it. After installing:
#   uv run playwright install chromium
playwright = ["scrapy-playwright>=0.0.42"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: hits the real internet (skipped unless RUN_LIVE_TESTS=1)",
    "integration: runs the backend/ and apps/api CLIs in their own environments",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["travel_scraper"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scrapy.*", "ddgs.*", "scrapy_playwright.*", "parsel.*", "itemadapter.*"]
ignore_missing_imports = true
