name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Opt out of OpenUI's install-time telemetry (sent by @openuidev/lang-core's
# postinstall during npm ci). See docs/openui-integration.md.
env:
  OPENUI_TELEMETRY_DISABLED: "1"

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Lint
        run: npm run lint:web

      - name: Unit tests
        run: npm run test:web

      - name: Build (type-checks + compiles)
        run: npm run build:web
