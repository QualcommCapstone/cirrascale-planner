name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Opt out of OpenUI's install-time telemetry (sent by @openuidev/lang-core's
# postinstall during npm ci). See docs/openui-integration.md.
env:
  OPENUI_TELEMETRY_DISABLED: "1"

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Lint
        run: npm run lint:web

      - name: Unit tests
        run: npm run test:web

      - name: Build (type-checks + compiles)
        run: npm run build:web

  api:
    name: API · Ruff · Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        working-directory: apps/api
        run: uv run ruff check .

      - name: Tests (pytest)
        working-directory: apps/api
        # Mock providers only — no real Cirrascale/Qdrant calls in CI.
        env:
          EMBEDDING_PROVIDER: mock
          VECTOR_STORE_PROVIDER: memory
          LLM_PROVIDER: mock
        run: uv run pytest -q
