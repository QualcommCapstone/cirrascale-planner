# Postgres with the pgvector extension, for local development.
#   docker compose up -d      start (data is kept in the "pgdata" volume)
#   docker compose down       stop (add -v to also erase the data)
# Matches the default DATABASE_URL in .env.example.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
