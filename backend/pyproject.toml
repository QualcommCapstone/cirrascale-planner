[project]
name = "planner-backend"
version = "0.1.0"
description = "Python backend for the AI100 Prompt-to-Plan Travel Planner (FastAPI + data/trust layer)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "scrapling[fetchers]>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "mypy>=2.4",
    "httpx2>=2.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: hits the real internet (skipped unless RUN_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["scrapling.*", "protego.*"]
ignore_missing_imports = true
